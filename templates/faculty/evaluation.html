{% extends "base.html" %}
{% block title %}Evaluation & Auto-Grading - Pragati by Kalpkrats{% endblock %}
{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-3xl font-extrabold text-slate-900">Evaluation & AI Auto-Grading Suite</h1>
        <p class="text-sm font-medium text-slate-600 mt-1">Automated submission evaluation, grammar/clarity checking, and plagiarism detection.</p>
    </div>

    <!-- AI Evaluator Interface -->
    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <h3 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-pen-ruler text-amber-600"></i> AI Assignment Submission Evaluator
        </h3>

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Assignment Title</label>
                <input type="text" id="evalTitle" value="Implementation of Hash Tables & Collision Resolution" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Student Code / Submission Text</label>
                <textarea id="evalText" rows="5" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 font-mono focus:outline-none focus:border-blue-500" placeholder="Paste student code or essay content here..."></textarea>
            </div>
            <button onclick="evaluateSubmissionAI()" class="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold shadow-md shadow-amber-200 transition">
                Evaluate & Check Plagiarism
            </button>
        </div>

        <div id="evalResultsOutput" class="hidden mt-4 p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
        </div>
    </div>
</div>

<script>
async function evaluateSubmissionAI() {
    const title = document.getElementById('evalTitle').value;
    const text = document.getElementById('evalText').value;
    const out = document.getElementById('evalResultsOutput');
    out.classList.remove('hidden');
    out.innerHTML = `<div class="text-amber-700 text-xs font-bold"><i class="fa-solid fa-circle-notch fa-spin"></i> AI Evaluator analyzing code structure and plagiarism index...</div>`;

    const formData = new FormData();
    formData.append('title', title);
    formData.append('submission_text', text);

    const res = await fetch('/faculty/evaluation', { method: 'POST', body: formData });
    const data = await res.json();
    
    out.innerHTML = `
        <div class="grid grid-cols-3 gap-3 text-center">
            <div class="p-3 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-xs font-semibold text-slate-500">Suggested Grade</div>
                <div class="text-2xl font-black text-emerald-600">${data.marks} / 100</div>
            </div>
            <div class="p-3 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-xs font-semibold text-slate-500">Plagiarism Score</div>
                <div class="text-2xl font-black text-blue-600">${data.plagiarism_percentage}%</div>
            </div>
            <div class="p-3 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-xs font-semibold text-slate-500">Grammar & Structure</div>
                <div class="text-2xl font-black text-purple-600">${data.grammar_score}%</div>
            </div>
        </div>
        <div class="text-xs text-slate-800 bg-white p-3.5 rounded-xl border border-slate-200 font-medium">
            <strong class="text-slate-900">AI Feedback:</strong> ${data.feedback}
        </div>
    `;
}
</script>
{% endblock %}
